<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter V6.0 - Maican Algo-Systems</title>
    <style>
        body {
            background-color: #0f1115;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: linear-gradient(145deg, #1a1d23, #14161a);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #ffcc00; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #a0a0a0; font-size: 1.1rem; line-height: 1.5; }
        
        .monitor-card {
            background: #1e2229;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid #333;
        }
        .monitor-title { color: #ffcc00; font-weight: bold; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { color: #777; font-size: 0.8rem; text-transform: uppercase; padding-bottom: 10px; }
        td { padding: 12px 5px; border-bottom: 1px solid #2a2e35; font-size: 0.95rem; }
        
        .status-win { color: #00ff88; font-weight: bold; }
        .profit { color: #00ff88; }

        .btn-telegram {
            display: inline-block;
            margin-top: 30px;
            background: #ffcc00;
            color: #000;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-telegram:hover { transform: scale(1.05); background: #e6b800; }
        
        .footer { margin-top: 40px; font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hunter V6.0</h1>
        <p>Algoritmos de alta precisión para el mercado moderno.</p>

        <div class="monitor-card">
            <div class="monitor-title">Monitoreo IQ Option OTC (En Vivo)</div>
            <table>
                <thead>
                    <tr>
                        <th>Activo</th>
                        <th>Estado</th>
                        <th>Profit %</th>
                    </tr>
                </thead>
                <tbody id="trade-table">
                    <tr>
                        <td>GBP/JPY-OTC</td>
                        <td class="status-win">● Venta Exitosa</td>
                        <td class="profit">+94%</td>
                    </tr>
                    <tr>
                        <td>GBP/USD-OTC</td>
                        <td class="status-win">● Venta Exitosa</td>
                        <td class="profit">+93%</td>
                    </tr>
                    <tr>
                        <td>USD/JPY-OTC</td>
                        <td class="status-win">● Compra Exitosa</td>
                        <td class="profit">+93%</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="https://t.me/mmmmm236581" class="btn-telegram">ADQUIRIR PLAN MENSUAL</a>
        
        <div class="footer">
            MAICAN ALGO-SYSTEMS © 2026
        </div>
    </div>

    <script>
        // Animación sencilla para simular trades en vivo
        const assets = ["EUR/USD-OTC", "GBP/JPY-OTC", "USD/JPY-OTC", "EUR/GBP-OTC", "GBP/USD-OTC"];
        const types = ["Compra Exitosa", "Venta Exitosa"];
        
        setInterval(() => {
            const table = document.getElementById('trade-table');
            const newRow = table.insertRow(0);
            const asset = assets[Math.floor(Math.random() * assets.length)];
            const type = types[Math.floor(Math.random() * types.length)];
            const profit = Math.floor(Math.random() * (95 - 85 + 1)) + 85;

            newRow.innerHTML = `
                <td>${asset}</td>
                <td class="status-win">● ${type}</td>
                <td class="profit">+${profit}%</td>
            `;

            if (table.rows.length > 5) {
                table.deleteRow(5);
            }
        }, 4000);
    </script>
</body>
</html>
